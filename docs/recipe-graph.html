const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': '原料、醬汁、料理的關係圖' });
cols.forEach((c, l) => {
  const kinds = new Set(c.map(d => d.t));
  const label = l === 0 ? '原料' : [...kinds].map(t => TYPES[t]).join('・');
  const t = el('text', { x: PADX + l * CW, y: 24, class: 'colhead' }, svg); t.textContent = `第 ${l + 1} 層　${label}`;
});
const gE = el('g', {}, svg), gN = el('g', {}, svg);
const edges = [];
D.forEach(d => d.i.forEach(p => {
  const a = xy[p], b = xy[d.id], x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
  edges.push({ from: p, to: d.id, e: el('path', { d: `M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`, class: 'edge' }, gE) });
}));
const nodes = {};
D.forEach(d => {
  const g = el('g', { class: `node ${d.t}${d.miss ? ' missing' : ''}`, transform: `translate(${xy[d.id].x} ${xy[d.id].y})`, tabindex: 0, role: 'button', 'aria-label': `${d.n}（${TYPES[d.t]}）` }, gN);
  el('rect', { width: NW, height: NH, rx: 7 }, g);
  const t = el('text', { x: 10, y: 19.5 }, g); t.textContent = d.n + (d.miss ? '（未收到）' : '');
  g.addEventListener('click', () => select(d.id));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(d.id); } });
  nodes[d.id] = g;
});
document.getElementById('canvas').appendChild(svg);

function walk(id, key, seen) { byId[id][key].forEach(x => { if (!seen.has(x)) { seen.add(x); walk(x, key, seen); } }); return seen; }
let selected = null;
const hiddenTypes = new Set();
function render() {
  const lineage = selected ? new Set([selected, ...walk(selected, 'i', new Set()), ...walk(selected, 'o', new Set())]) : null;
  D.forEach(d => {
    const g = nodes[d.id];
    g.classList.toggle('sel', d.id === selected);
    g.classList.toggle('dim', hiddenTypes.has(d.t) || (lineage && !lineage.has(d.id)));
  });
  edges.forEach(x => {
    const on = lineage && lineage.has(x.from) && lineage.has(x.to);
    x.e.classList.toggle('on', !!on);
    x.e.classList.toggle('dim', hiddenTypes.has(byId[x.from].t) || hiddenTypes.has(byId[x.to].t) || (lineage && !on));
  });
}
const chip = id => `<button class="chip" data-go="${id}"><i style="background:var(--${byId[id].t})"></i>${byId[id].n}</button>`;
function card(id) {
  const d = byId[id], c = document.getElementById('card');
  const steps = d.s && d.s.length ? `<ol>${d.s.map(s => `<li>${s}</li>`).join('')}</ol>` : `<p class="empty">${d.t === 'raw' ? '基本食材，點右邊的連結看它用在哪裡。' : '書上的做法還沒收到。'}</p>`;
  c.innerHTML = `<span class="badge ${d.t}">${TYPES[d.t]}${d.miss ? '・做法未收到' : ''}</span><h2>${d.n}</h2>`
    + (d.t !== 'raw' ? `<h3>做法</h3>${steps}` : steps)
    + (d.m && d.m.length ? `<h3>手藝時刻（可做成特寫）</h3><ul>${d.m.map(s => `<li>${s}</li>`).join('')}</ul>` : '')
    + `<h3>用到</h3>${d.i.length ? `<div class="links">${d.i.map(chip).join('')}</div>` : '<p class="empty">無</p>'}`
    + `<h3>用在</h3>${d.o.length ? `<div class="links">${d.o.map(chip).join('')}</div>` : '<p class="empty">無</p>'}`
    + (d.x ? `<p class="note">${d.x}</p>` : '');
  c.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { select(b.dataset.go); scrollTo(b.dataset.go); }));
}
function select(id) { selected = id; card(id); render(); try { history.replaceState(null, '', '#' + id); } catch (e) {} }
function scrollTo(id) {
  const cv = document.getElementById('canvas'), p = xy[id], s = zoom;
  cv.scrollTo({ left: Math.max(0, p.x * s - cv.clientWidth / 2 + NW * s / 2), top: Math.max(0, p.y * s - cv.clientHeight / 2), behavior: 'smooth' });
}

// Legend toggles which kinds are shown.
const lg = document.getElementById('legend');
Object.entries(TYPES).forEach(([t, name]) => {
  const n = D.filter(d => d.t === t).length;
  const b = document.createElement('button'); b.className = 'chip'; b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<i style="background:var(--${t})"></i>${name} ${n}`;
  b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') === 'true'; b.setAttribute('aria-pressed', String(!on)); on ? hiddenTypes.add(t) : hiddenTypes.delete(t); render(); });
  lg.appendChild(b);
});

let zoom = 1;
function setZoom(z) { zoom = Math.min(1.6, Math.max(.4, z)); svg.setAttribute('width', W * zoom); svg.setAttribute('height', H * zoom); }
document.getElementById('zoomIn').onclick = () => setZoom(zoom + .2);
document.getElementById('zoomOut').onclick = () => setZoom(zoom - .2);
document.getElementById('zoomReset').onclick = () => setZoom(1);

document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim();
  if (!q) return;
  const hit = D.find(d => d.n.includes(q));
  if (hit) { select(hit.id); scrollTo(hit.id); }
});

const start = (location.hash || '').slice(1);
select(byId[start] ? start : 'bechamel');
if (window.innerWidth < 700) setZoom(.8);
requestAnimationFrame(() => scrollTo(selected));
</script>
</body>
</html>
